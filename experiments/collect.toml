# M1 teacher data (SPEC §4, Q6, Q7): the update records of the 160 training personas (train set)
# and Elicitor's 12 dev personas (validation set), 45 calibration questions x 2 answer seeds per
# persona, and 25 judge units per persona. Never the eval personas. One job of at most 6 h on 4
# GPUs. Submit from the repo root:
#   cluster/submit.sh cluster/collect.sbatch

name = "collect"
domain = "travel"
data_dir = "../data"
seed = 20261026
splits = ["train", "dev"]
answer_seeds = 2

[judge]
edges = [0.5, 0.6, 0.7, 0.8]  # utility bins < 0.5, 0.5-0.6, 0.6-0.7, 0.7-0.8, >= 0.8
per_bin = 5

# Identical to the [llm] table of Elicitor's m5_full.toml at the pinned commit, so the teachers
# answer exactly as in the full run.
[llm]
provider = "ollama"
base_url = "http://127.0.0.1:11434"  # replaced by ELICITOR_SERVERS_AGENT / _USER in the job
num_ctx = 2048
think = { agent = false }  # qwen3 thinks unless told not to; llama3.3 has no thinking mode
timeout = 600

[llm.models]
agent = "qwen3:32b"
user = "llama3.3:latest"  # the 70B Q4_K_M (42.5 GB); the shared model folder has no :70b tag
