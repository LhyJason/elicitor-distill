# Written by `distill m3-file` from m3_calibrate.toml; model elicitor-qwen3-1.7b-zs.
# M3 calibration template (SPEC §7.2): Elicitor's m5_smoke.toml at the pinned commit, whose
# `elicitor calibrate` measured the teacher's rho (0.99 / 0.97 / 0.85) on the 12 dev personas
# with seed 7000. `distill m3-file` replaces the name, the agent model and the data folder; the
# job copies the teacher calibration's reply cache first, so every simulator answer is the one
# the teacher read and only the `update` calls are new. Everything below the name is unchanged.

name = "calibrate_qwen3-1.7b-zs"
domain = "travel"
data_dir = "../../data"
split = "dev"
seed = 7000
replicates = 1
budgets = [3, 5, 8]
tau = 0.9
selectors = ["fixed", "random", "max_entropy", "entropy_choice", "eig"]
updaters = ["rule", "llm"]
phrasers = ["tpl"]
extra_arms = ["sel=eig,upd=llm,phr=llm", "sel=eig_mc,upd=llm,phr=tpl"]

[arm_budgets]
"sel=eig_mc,upd=llm,phr=tpl" = [5]

[simulator]
kind = "llm"

[selector.eig]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }

[selector.entropy_choice]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }

[selector.eig_mc]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }
shortlist = 5
samples = 3

[updater.rule]
rho = { open = 0.7, choice = 0.8, yesno = 0.9 }

[llm]
provider = "ollama"
base_url = "http://127.0.0.1:11434"  # replaced by ELICITOR_SERVERS_AGENT / _USER in the job
num_ctx = 2048
think = { agent = false }  # qwen3 thinks unless told not to; llama3.3 has no thinking mode
timeout = 600

[llm.models]
agent = "elicitor-qwen3-1.7b-zs"
user = "llama3.3:latest"  # the 70B Q4_K_M (42.5 GB); the shared model folder has no :70b tag
