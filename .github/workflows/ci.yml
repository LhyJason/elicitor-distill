name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: distill make-personas --check
      - run: distill collect experiments/collect_mock.toml --out results/collect_mock --workers 4
      - run: distill judge-collect experiments/collect_mock.toml --out results/collect_mock --workers 4

  # The training chain on a tiny random model (tests/test_train_stack.py), CPU only.
  train-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,train]"
      - run: pytest tests/test_train_stack.py
